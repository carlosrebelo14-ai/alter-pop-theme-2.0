# Shopify CLI — Alterpop OS 2.0 theme (Dawn-based)
# Docs: https://shopify.dev/docs/storefronts/themes/tools/cli
#
# Uso:
#   shopify theme dev      # sobe um development theme + hot-reload em 127.0.0.1:9292
#   shopify theme list     # ver themes da loja + IDs
#   shopify theme push --theme <id>   # publicar para um theme existente
#
# Nota: o handle real da loja Alterpop e' jyr17t-wr.myshopify.com
# (dominio permanente .myshopify.com). "alterpop-store" nao resolve.

store = "jyr17t-wr.myshopify.com"
# theme = "123456789012"   # opcional: ID de um theme fixo para push

ignore = [
  "shopify.theme.toml",
  "README.md",
  "LICENSE.md",
  "release-notes.md",
  ".git/**",
  ".github/**",
  ".gitignore",
  ".prettierrc.json",
  ".theme-check.yml",
  ".shopify/**",
  ".DS_Store",
  "**/.DS_Store",
]
